# nginx site for Dishaa Platinum (static). Replace DOMAIN / APEX below, then:
#   sudo cp nginx-dishaa.conf /etc/nginx/sites-available/dishaa && sudo ln -s /etc/nginx/sites-available/dishaa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.dishaaplatinum.com -d dishaaplatinum.com     # free HTTPS (Let's Encrypt)

server {
    listen 80;
    listen [::]:80;
    server_name www.dishaaplatinum.com dishaaplatinum.com;

    root /var/www/www.dishaaplatinum.com;
    index index.html;

    # apex -> www (one canonical host for SEO)
    if ($host = dishaaplatinum.com) { return 301 https://www.dishaaplatinum.com$request_uri; }

    # clean folder URLs: /about -> /about/ -> /about/index.html
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # long cache for images, video, fonts; short for pages, css and js (they change on each deploy)
    location ~* \.(webp|png|jpg|jpeg|svg|ico|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
